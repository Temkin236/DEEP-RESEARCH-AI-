[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-ai-backend"
version = "1.0.0"
description = "Multi-Agent Research Assistant backend with LangGraph, FastAPI, and Chroma"
authors = [{ name = "Deep Research AI Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "google-generativeai>=0.8.0",
    "openai>=1.45.0",
    "chromadb>=0.5.5",
    "pypdf>=4.3.1",
    "python-docx>=1.1.2",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.3",
    "duckduckgo-search>=6.2.0",
    "pydantic-ai>=2.0.0",
    "python-pptx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
